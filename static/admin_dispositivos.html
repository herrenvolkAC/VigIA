<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VigIA - Dispositivos</title>
  <style>
    :root{--bg:#f2f4f1;--panel:#fff;--ink:#0e1620;--soft:#5c6773;--rule:#d4dbd8;--strong:#a9b4ac;--green:#1f7a4d;--green-bg:#e5f3e9;--red:#c8102e;--red-bg:#f7d7da;--amber:#b25f00;--amber-bg:#fbe7c8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
    header{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--strong)}
    .brand{display:flex;align-items:center;gap:14px}.brand img{width:52px}.kicker,th,button,.button{font-family:Consolas,"Courier New",monospace;text-transform:uppercase;letter-spacing:.12em}.kicker{font-size:10px;color:var(--soft)}h1{font-size:22px;margin:2px 0 0}
    main{padding:22px 24px 40px}.band{background:var(--panel);border:1px solid var(--rule);padding:18px}.band-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    h2{margin:0;font-size:17px}.muted{font-size:12px;color:var(--soft)}.actions{display:flex;gap:8px;flex-wrap:wrap}
    button,.button{min-height:34px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:8px 12px;text-decoration:none;cursor:pointer;font-size:11px}
    .primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.ok{color:var(--green);background:var(--green-bg);border-color:var(--green)}.warn{color:var(--red);background:var(--red-bg);border-color:var(--red)}
    table{width:100%;border-collapse:collapse;background:var(--panel)}th{text-align:left;color:var(--soft);background:#f6f8f5;font-size:10px;padding:10px 8px;border-bottom:1px solid var(--rule)}
    td{padding:10px 8px;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:top}tr:nth-child(odd) td{background:#f8faf7}.mono{font-family:Consolas,"Courier New",monospace}.ua{max-width:430px;color:var(--soft);font-size:12px}
    .pill{display:inline-flex;min-height:22px;align-items:center;padding:3px 8px;border:1px solid var(--rule);font:700 10px Consolas,"Courier New",monospace;text-transform:uppercase;letter-spacing:.12em}
    .pending{color:var(--amber);background:var(--amber-bg);border-color:var(--amber)}.approved{color:var(--green);background:var(--green-bg);border-color:var(--green)}.rejected,.revoked{color:var(--red);background:var(--red-bg);border-color:var(--red)}
    .message{min-height:18px;font-size:12px;color:var(--soft);margin-bottom:8px}.table-wrap{overflow-x:auto}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/resources/APPLogo.png?v=20260416-102647" alt="Logo VigIA">
      <div><div class="kicker">Admin - seguridad local</div><h1>Dispositivos</h1></div>
    </div>
    <nav class="actions">
      <a class="button" href="/admin/usuarios">Usuarios</a>
      <a class="button" href="/admin/accesos">Accesos</a>
      <a class="button" href="/admin/auditoria">Auditoria</a>
      <a class="button" href="/selector">Selector</a>
      <button id="logout-btn">Salir</button>
    </nav>
  </header>
  <main>
    <section class="band">
      <div class="band-head">
        <div>
          <h2>Solicitudes de navegador</h2>
          <div class="muted">Cada navegador aprobado queda asociado al usuario que hizo el primer ingreso.</div>
        </div>
        <button class="primary" id="refresh-btn">Refrescar</button>
      </div>
      <div class="message" id="message"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Estado</th><th>Usuario</th><th>Dispositivo</th><th>IP</th><th>Primer ingreso</th><th>Ultimo uso</th><th>Navegador</th><th>Accion</th></tr></thead>
          <tbody id="devices-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const body=document.getElementById('devices-body'),msg=document.getElementById('message');
    function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
    function setMsg(t,e=false){msg.textContent=t||'';msg.style.color=e?'var(--red)':'var(--soft)'}
    async function api(path,opt={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(r.status===401){location.href='/login?next=/admin/dispositivos';return null}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'La operacion no pudo completarse.');return d}
    async function load(){setMsg('Consultando...');const d=await api('/api/auth/admin/devices');if(!d)return;body.innerHTML=(d.devices||[]).map(row=>`<tr>
      <td><span class="pill ${esc(row.status)}">${esc(row.status)}</span></td><td class="mono">${esc(row.username)}</td><td class="mono">${esc(row.device_short)}</td><td class="mono">${esc(row.ip_address)}</td><td class="mono">${esc(row.first_seen)}</td><td class="mono">${esc(row.last_seen)}</td><td class="ua">${esc(row.user_agent)}</td>
      <td><div class="actions">${row.status!=='approved'?`<button class="ok" data-action="approve" data-device="${esc(row.device_id)}">Aprobar</button>`:''}${row.status==='pending'?`<button data-action="reject" data-device="${esc(row.device_id)}">Rechazar</button>`:''}${row.status==='approved'?`<button class="warn" data-action="revoke" data-device="${esc(row.device_id)}">Revocar</button>`:''}</div></td>
    </tr>`).join('')||'<tr><td colspan="8" class="muted">Sin solicitudes registradas.</td></tr>';setMsg('Actualizado.')}
    body.addEventListener('click',async ev=>{const b=ev.target.closest('button[data-action]');if(!b)return;try{await api(`/api/auth/admin/devices/${b.dataset.action}`,{method:'POST',body:JSON.stringify({device_id:b.dataset.device})});await load()}catch(e){setMsg(e.message,true)}});
    document.getElementById('refresh-btn').onclick=()=>load().catch(e=>setMsg(e.message,true));
    document.getElementById('logout-btn').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});location.href='/login'};
    load().catch(e=>setMsg(e.message,true));
  </script>
</body>
</html>
