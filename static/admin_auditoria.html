<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VigIA - Auditoria</title>
  <style>
    :root{--bg:#f2f4f1;--panel:#fff;--ink:#0e1620;--soft:#5c6773;--rule:#d4dbd8;--strong:#a9b4ac;--red:#c8102e;--red-bg:#f7d7da}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
    header{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--strong)}
    .brand{display:flex;align-items:center;gap:14px}.brand img{width:52px}.kicker,label,th,button,.button{font-family:Consolas,"Courier New",monospace;text-transform:uppercase;letter-spacing:.12em}.kicker{font-size:10px;color:var(--soft)}h1{font-size:22px;margin:2px 0 0}
    main{padding:22px 24px 40px;display:grid;gap:18px}.band{background:var(--panel);border:1px solid var(--rule);padding:18px}.band-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    h2{margin:0;font-size:17px}.muted{font-size:12px;color:var(--soft)}.actions{display:flex;gap:8px;flex-wrap:wrap}
    button,.button{min-height:34px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:8px 12px;text-decoration:none;cursor:pointer;font-size:11px}.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    label{display:block;font-size:10px;color:var(--soft);margin-bottom:6px}input,select{width:100%;min-height:36px;border:1px solid var(--rule);background:var(--panel);padding:7px 9px}
    .filters{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr)) auto;gap:12px;align-items:end}.message{min-height:18px;font-size:12px;color:var(--soft)}
    table{width:100%;border-collapse:collapse;background:var(--panel)}th{text-align:left;color:var(--soft);background:#f6f8f5;font-size:10px;padding:10px 8px;border-bottom:1px solid var(--rule)}td{padding:10px 8px;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:top}tr:nth-child(odd) td{background:#f8faf7}.mono{font-family:Consolas,"Courier New",monospace}.table-wrap{overflow-x:auto}.path{max-width:300px;word-break:break-word}.action-text{min-width:260px}.status-bad{color:var(--red);background:var(--red-bg);padding:2px 6px;border:1px solid var(--red)}
    @media(max-width:1100px){.filters{grid-template-columns:1fr 1fr}.band-head,header{align-items:flex-start;flex-direction:column}}
    @media(max-width:700px){.filters{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/resources/APPLogo.png?v=20260416-102647" alt="Logo VigIA">
      <div><div class="kicker">Admin - auditoria</div><h1>Uso registrado</h1></div>
    </div>
    <nav class="actions">
      <a class="button" href="/admin/dispositivos">Dispositivos</a>
      <a class="button" href="/admin/usuarios">Usuarios</a>
      <a class="button" href="/admin/accesos">Accesos</a>
      <a class="button" href="/selector">Selector</a>
      <button id="logout-btn">Salir</button>
    </nav>
  </header>
  <main>
    <section class="band">
      <div class="band-head">
        <div><h2>Eventos</h2><div class="muted">Vista basica de los registros guardados en SQLite. El TXT queda para eventos de atencion.</div></div>
        <button class="primary" id="refresh-btn">Refrescar</button>
      </div>
      <form class="filters" id="filters">
        <div><label for="f-user">Usuario</label><input id="f-user" autocomplete="off"></div>
        <div><label for="f-module">Modulo</label><input id="f-module" autocomplete="off" placeholder="rendimiento_online"></div>
        <div><label for="f-action">Accion</label><input id="f-action" autocomplete="off" placeholder="open_page"></div>
        <div><label for="f-from">Desde</label><input id="f-from" type="date"></div>
        <div><label for="f-to">Hasta</label><input id="f-to" type="date"></div>
        <div><label for="f-limit">Limite</label><select id="f-limit"><option>100</option><option selected>200</option><option>500</option><option>1000</option></select></div>
        <button class="primary" type="submit">Buscar</button>
      </form>
      <div class="message" id="message"></div>
    </section>
    <section class="band">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fecha</th><th>Hora</th><th>Usuario</th><th>IP</th><th>Modulo</th><th>Accion</th><th>Ruta</th><th>Metodo</th><th>Estado</th></tr></thead>
          <tbody id="events-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const body=document.getElementById('events-body'),msg=document.getElementById('message');
    function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
    function setMsg(t,e=false){msg.textContent=t||'';msg.style.color=e?'var(--red)':'var(--soft)'}
    async function api(path,opt={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(r.status===401){location.href='/login?next=/admin/auditoria';return null}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'La operacion no pudo completarse.');return d}
    function params(){const p=new URLSearchParams();const values={username:document.getElementById('f-user').value.trim(),module:document.getElementById('f-module').value.trim(),action:document.getElementById('f-action').value.trim(),fecha_desde:document.getElementById('f-from').value,fecha_hasta:document.getElementById('f-to').value,limit:document.getElementById('f-limit').value};Object.entries(values).forEach(([k,v])=>{if(v)p.set(k,v)});return p.toString()}
    function statusCell(value){if(value==null)return '';const n=Number(value);return n>=400?`<span class="status-bad">${esc(value)}</span>`:esc(value)}
    function render(events){body.innerHTML=(events||[]).map(row=>`<tr>
      <td class="mono">${esc(row.fecha)}</td>
      <td class="mono">${esc(row.hora)}</td>
      <td class="mono">${esc(row.username||'sin_usuario')}</td>
      <td class="mono">${esc(row.ip_address||'')}</td>
      <td>${esc(row.module_label||row.module||'')}</td>
      <td class="action-text">${esc(row.action_label||row.action||'')}</td>
      <td class="mono path">${esc(row.path||'')}</td>
      <td class="mono">${esc(row.method||'')}</td>
      <td class="mono">${statusCell(row.status_code)}</td>
    </tr>`).join('')||'<tr><td colspan="9" class="muted">Sin eventos para el filtro.</td></tr>'}
    async function load(){setMsg('Consultando...');const q=params();const data=await api(`/api/auth/admin/usage-events${q?'?'+q:''}`);if(!data)return;render(data.events||[]);setMsg(`Actualizado. Registros: ${(data.events||[]).length}.`)}
    document.getElementById('filters').addEventListener('submit',ev=>{ev.preventDefault();load().catch(e=>setMsg(e.message,true))});
    document.getElementById('refresh-btn').onclick=()=>load().catch(e=>setMsg(e.message,true));
    document.getElementById('logout-btn').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});location.href='/login'};
    load().catch(e=>setMsg(e.message,true));
  </script>
</body>
</html>
