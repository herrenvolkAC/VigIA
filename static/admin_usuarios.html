<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VigIA - Usuarios</title>
  <style>
    :root{--bg:#f2f4f1;--panel:#fff;--ink:#0e1620;--soft:#5c6773;--rule:#d4dbd8;--strong:#a9b4ac;--green:#1f7a4d;--green-bg:#e5f3e9;--red:#c8102e;--red-bg:#f7d7da}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
    header{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--strong)}
    .brand{display:flex;align-items:center;gap:14px}.brand img{width:52px}.kicker,label,th,button,.button{font-family:Consolas,"Courier New",monospace;text-transform:uppercase;letter-spacing:.12em}.kicker{font-size:10px;color:var(--soft)}h1{font-size:22px;margin:2px 0 0}
    main{padding:22px 24px 40px;display:grid;gap:18px}.band{background:var(--panel);border:1px solid var(--rule);padding:18px}.band-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    h2{margin:0;font-size:17px}.muted{font-size:12px;color:var(--soft)}.actions{display:flex;gap:8px;flex-wrap:wrap}
    button,.button{min-height:34px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:8px 12px;text-decoration:none;cursor:pointer;font-size:11px}.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.ok{color:var(--green);background:var(--green-bg);border-color:var(--green)}.warn{color:var(--red);background:var(--red-bg);border-color:var(--red)}
    form{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr)) auto;gap:12px;align-items:end}label{display:block;font-size:10px;color:var(--soft);margin-bottom:6px}input,select{width:100%;min-height:36px;border:1px solid var(--rule);background:var(--panel);padding:7px 9px}
    .password-row{display:grid;grid-template-columns:1fr auto;gap:8px}.message{min-height:18px;font-size:12px;color:var(--soft)}
    table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--soft);background:#f6f8f5;font-size:10px;padding:10px 8px;border-bottom:1px solid var(--rule)}td{padding:10px 8px;border-bottom:1px solid var(--rule);font-size:13px}tr:nth-child(odd) td{background:#f8faf7}.mono{font-family:Consolas,"Courier New",monospace}.table-wrap{overflow-x:auto}
    .pill{display:inline-flex;min-height:22px;align-items:center;padding:3px 8px;border:1px solid var(--rule);font:700 10px Consolas,"Courier New",monospace;text-transform:uppercase;letter-spacing:.12em}
    @media(max-width:900px){form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/resources/APPLogo.png?v=20260416-102647" alt="Logo VigIA">
      <div><div class="kicker">Admin - identidad</div><h1>Usuarios</h1></div>
    </div>
    <nav class="actions">
      <a class="button" href="/admin/dispositivos">Dispositivos</a>
      <a class="button" href="/admin/accesos">Accesos</a>
      <a class="button" href="/selector">Selector</a>
      <button id="logout-btn">Salir</button>
    </nav>
  </header>
  <main>
    <section class="band">
      <div class="band-head"><div><h2>Alta local</h2><div class="muted">La contrasena no se guarda en claro. Los accesos por app se administran aparte.</div></div></div>
      <form id="user-form">
        <div><label for="new-user">Usuario</label><input id="new-user" autocomplete="off" required></div>
        <div><label for="new-name">Nombre</label><input id="new-name" autocomplete="off"></div>
        <div><label for="new-pass">Contrasena</label><div class="password-row"><input id="new-pass" type="text" autocomplete="new-password" minlength="4" required><button type="button" id="generate-pass">Auto</button></div></div>
        <div><label for="new-role">Rol base</label><select id="new-role"><option value="user">Usuario</option><option value="rrhh">RRHH</option><option value="admin">Admin</option></select></div>
        <button class="primary" type="submit">Crear usuario</button>
      </form>
      <div class="message" id="message"></div>
    </section>
    <section class="band">
      <div class="band-head"><div><h2>Usuarios</h2><div class="muted">La habilitacion de modulos vive en Accesos.</div></div><button class="primary" id="refresh-btn">Refrescar</button></div>
      <div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Accion</th></tr></thead><tbody id="users-body"></tbody></table></div>
    </section>
  </main>
  <script>
    const usersBody=document.getElementById('users-body'),msg=document.getElementById('message');let accessContext=null,mailContext=null;
    function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
    function setMsg(t,e=false){msg.textContent=t||'';msg.style.color=e?'var(--red)':'var(--soft)'}
    function randomPassword(len=8){const a='abcdefghijklmnopqrstuvwxyz0123456789',b=new Uint8Array(len);crypto.getRandomValues(b);return Array.from(b,x=>a[x%a.length]).join('')}
    async function api(path,opt={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(r.status===401){location.href='/login?next=/admin/usuarios';return null}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'La operacion no pudo completarse.');return d}
    function enabledApps(username){const access=(accessContext?.accesses||{})[username]||{};const modules=accessContext?.modules||[];return modules.filter(m=>access[m.id]?.enabled&&m.path)}
    async function buildMail(username,name){const storageKey=`vigia_user_pass_${username.toLowerCase()}`;let password=sessionStorage.getItem(storageKey)||prompt(`Contrasena inicial para ${username}:`)||'';if(!password){setMsg('No se armo el correo porque falta la contrasena.',true);return}const origin=(mailContext?.origin)||location.origin;const apps=enabledApps(username);const links=apps.length?apps.map(app=>`${app.label}: ${origin}${app.path}`):['Todavia no tiene aplicaciones habilitadas.'];const body=[`Hola ${name||username},`,'','Te comparto el acceso a VigIA.','','Aplicaciones disponibles:',...links,'','Datos de acceso:',`Usuario: ${username}`,`Contrasena: ${password}`,'','Ingresa desde la PC/navegador que vas a usar habitualmente. Luego un administrador debe aprobar el dispositivo en /admin/dispositivos.','','Gracias.'].join('\n');try{await navigator.clipboard.writeText(body);setMsg('Correo copiado al portapapeles y abierto con la app predeterminada.')}catch{setMsg('Correo abierto con la app predeterminada.')}location.href=`mailto:?subject=${encodeURIComponent('Acceso a VigIA')}&body=${encodeURIComponent(body)}`}
    async function load(){setMsg('Consultando...');const users=await api('/api/auth/admin/users');accessContext=await api('/api/auth/admin/access-context');mailContext=await api('/api/auth/admin/mail-context');if(!users)return;usersBody.innerHTML=(users.users||[]).map(u=>`<tr><td class="mono"><strong>${esc(u.username)}</strong></td><td>${esc(u.display_name||'')}</td><td><span class="pill">${esc(u.role)}</span></td><td>${u.active?'Activo':'Inactivo'}</td><td><div class="actions"><a class="button" href="/admin/accesos?user=${encodeURIComponent(u.username)}">Accesos</a><button data-mail="${esc(u.username)}" data-name="${esc(u.display_name||u.username)}">Correo</button><button class="${u.active?'warn':'ok'}" data-action="${u.active?'deactivate':'activate'}" data-user="${esc(u.username)}">${u.active?'Desactivar':'Activar'}</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Sin usuarios.</td></tr>';setMsg('Actualizado.')}
    document.getElementById('user-form').addEventListener('submit',async ev=>{ev.preventDefault();const username=document.getElementById('new-user').value.trim();const password=document.getElementById('new-pass').value;try{await api('/api/auth/admin/users',{method:'POST',body:JSON.stringify({username,display_name:document.getElementById('new-name').value.trim(),password,role:document.getElementById('new-role').value})});sessionStorage.setItem(`vigia_user_pass_${username.toLowerCase()}`,password);ev.target.reset();await load();setMsg('Usuario creado. Configura sus accesos en la pantalla Accesos.')}catch(e){setMsg(e.message,true)}});
    usersBody.addEventListener('click',async ev=>{const mail=ev.target.closest('button[data-mail]');if(mail){await buildMail(mail.dataset.mail,mail.dataset.name);return}const b=ev.target.closest('button[data-action]');if(!b)return;try{await api(`/api/auth/admin/users/${b.dataset.action}`,{method:'POST',body:JSON.stringify({username:b.dataset.user})});await load()}catch(e){setMsg(e.message,true)}});
    document.getElementById('generate-pass').onclick=()=>{const i=document.getElementById('new-pass');i.value=randomPassword();i.focus();i.select()};
    document.getElementById('refresh-btn').onclick=()=>load().catch(e=>setMsg(e.message,true));
    document.getElementById('logout-btn').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});location.href='/login'};
    load().catch(e=>setMsg(e.message,true));
  </script>
</body>
</html>
