$('form').addEventListener('submit',async e=>{e.preventDefault();const s=$('status');s.className='status';s.textContent='Guardando...';const fd=new FormData(e.target);const plus=[...document.querySelectorAll('.plus-row')].map(r=>({plu_codigo:r.querySelector('.p-code').value.split(' · ')[0].trim(),plu_articulo:r.querySelector('.p-name').value,afectacion:r.querySelector('.p-aff').value||null,observacion:r.querySelector('.p-obs').value}));fd.set('plus_json',JSON.stringify(plus));[...$('fotos').files].forEach(f=>fd.append('fotos',f));try{const d=await api('/api/recepcion',{method:'POST',body:fd});s.textContent='Guardado correctamente. ID '+d.id;e.target.reset();$('plus-list').innerHTML='';addPlus();$('preview').innerHTML='';$('fecha').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}catch(err){s.className='status error';s.textContent=err.message}});async function loadList(){try{const p=new URLSearchParams({q:$('filter').value,fecha_desde:$('desde').value,fecha_hasta:$('hasta').value});const d=await api('/api/recepcion?'+p);$('rows').innerHTML=(d.items||[]).map(r=>`<tr><td>${r.id}</td><td>${esc(r.fecha_descarga)}</td><td>${esc(r.proveedor_nombre)}</td><td>${esc(r.recepcionista_nombre)}</td><td>${r.pallets_recibidos}/${r.pallets_auditados}</td><td>${r.cantidad_plus}</td><td>${r.cantidad_fotos}</td><td><button class="btn" onclick="openDetail(${r.id})">Abrir</button></td></tr>`).join('')||'<tr><td colspan="8">Sin registros.</td></tr>'}catch(e){$('rows').innerHTML=`<tr><td colspan="8" class="error">${esc(e.message)}</td></tr>`}}async function openDetail(id){try{const d=await api('/api/recepcion/'+id);$('detail').innerHTML=`<div class="cards">${[['Fecha',d.recepcion.fecha_descarga],['Proveedor',d.recepcion.proveedor_nombre],['Recepcionista',d.recepcion.recepcionista_nombre],['Pallets',d.recepcion.pallets_recibidos+' / '+d.recepcion.pallets_auditados]].map(x=>`<div class="card"><small>${esc(x[0])}</small><strong>${esc(x[1])}</strong></div>`).join('')}</div><h3>PLU</h3><ul>${d.plus.map(x=>`<li>${esc(x.plu_codigo)} · ${esc(x.plu_articulo)} ${x.afectacion?`(${esc(x.afectacion)}%)`:''}</li>`).join('')}</ul><h3>Fotos</h3><div class="photos">${d.fotos.map(x=>`<a href="/api/recepcion/fotos/${x.id}" target="_blank"><img class="thumb" src="/api/recepcion/fotos/${x.id}" alt="${esc(x.nombre_original)}"></a>`).join('')||'Sin fotos'}</div>`;$('modal').classList.remove('hidden')}catch(e){alert(e.message)}}function closeDetail(){$('modal').classList.add('hidden')}(async()=>{try{if(typeof checkAuth==='function'&&!checkAuth())return;initHeader('recepcion',{showClock:false})}catch(e){}})();

<script>
window.addEventListener('DOMContentLoaded',()=>{
  let seq=0;
  function wirePlus(row){
    const old=row.querySelector('.p-code'); if(!old)return;
    const input=old.cloneNode(true); const listId='plus-suggestions-'+(++seq); input.setAttribute('list',listId); input.autocomplete='off';
    const list=document.createElement('datalist'); list.id=listId; old.replaceWith(input); input.insertAdjacentElement('afterend',list);
    let timer;
    input.addEventListener('input',()=>{clearTimeout(timer); row.querySelector('.p-name').value=''; const q=input.value.trim(); if(q.length<2){list.innerHTML='';return} timer=setTimeout(async()=>{try{oracleWait(true);const d=await api('/api/recepcion/catalogos/plus?q='+encodeURIComponent(q)); list.innerHTML=(d.items||[]).map(x=>`<option value="${esc(x.codigo+' · '+x.nombre)}"></option>`).join('')}catch(e){list.innerHTML=''}finally{oracleWait(false)}},300)});
    input.addEventListener('change',()=>{const value=input.value.trim(); const option=[...list.options].find(x=>x.value===value); if(!option){row.querySelector('.p-name').value='';return} const parts=value.split(' · '); input.value=parts.shift(); row.querySelector('.p-name').value=parts.join(' · ')});
  }
  function wireAll(){document.querySelectorAll('.plus-row').forEach(wirePlus)}
  const originalAddPlus=window.addPlus;
  window.addPlus=function(){originalAddPlus(); const row=document.querySelector('#plus-list .plus-row:last-child'); if(row)wirePlus(row)};
  wireAll();
});
</script>

window.addEventListener('DOMContentLoaded',()=>{
  let seq=1000;
  function wireCatalog(inputId,codeId,nameId,url){
    const old=document.getElementById(inputId); if(!old)return;
    const input=old.cloneNode(true); const listId='catalog-suggestions-'+(++seq); input.setAttribute('list',listId); input.autocomplete='off'; old.replaceWith(input);
    const list=document.createElement('datalist'); list.id=listId; input.insertAdjacentElement('afterend',list); let timer;
    input.addEventListener('input',()=>{clearTimeout(timer);document.getElementById(codeId).value='';document.getElementById(nameId).value='';const q=input.value.trim();if(q.length<2){list.innerHTML='';return}timer=setTimeout(async()=>{try{oracleWait(true);const d=await api(url+encodeURIComponent(q));list.innerHTML=(d.items||[]).map(x=>`<option value="${esc(x.codigo+' · '+x.nombre)}"></option>`).join('')}catch(e){list.innerHTML=''}finally{oracleWait(false)}},300)});
    input.addEventListener('change',()=>{const value=input.value.trim();const option=[...list.options].find(x=>x.value===value);if(!option){document.getElementById(codeId).value='';document.getElementById(nameId).value='';return}const parts=value.split(' · ');document.getElementById(codeId).value=parts.shift();document.getElementById(nameId).value=parts.join(' · ')});
  }
  wireCatalog('proveedor','proveedor_codigo','proveedor_nombre','/api/recepcion/catalogos/proveedores?q=');
  wireCatalog('empleado','legajo','nombre_legajo','/api/recepcion/catalogos/legajos?q=');
});
</script>
<script>
let oracleRequests=0;
function oracleWait(active){
  oracleRequests=Math.max(0,oracleRequests+(active?1:-1));
  document.documentElement.classList.toggle('oracle-wait',oracleRequests>0);
}
document.head.insertAdjacentHTML('beforeend','<style>html.oracle-wait,html.oracle-wait *{cursor:wait!important}</style>');
</script>
<script>
document.head.insertAdjacentHTML('beforeend','<style>#plus-list{display:flex;flex-direction:column;gap:18px}.plus-row{border:2px solid #8FB9A0;border-top:5px solid var(--green);border-radius:3px;background:#F1F7F3;box-shadow:0 4px 10px rgba(14,22,32,.12);padding:13px;margin:0}.plus-row .p-code,.plus-row .p-name,.plus-row .p-aff,.plus-row .p-obs{background:#fff}.plus-row .p-photos{background:#fff}.plus-photo-wrap{grid-column:1/-1;display:flex;align-items:center;gap:8px;border-top:1px solid #B8CEC0;padding-top:9px;margin-top:3px}.plus-photo-wrap label{font-size:10px;white-space:nowrap;color:var(--muted)}.plus-photo-wrap input{height:auto;padding:5px;font-size:11px}.plu-detail{border:1px solid var(--line);border-top:3px solid var(--green);padding:10px 12px;margin:8px 0}.plu-detail h4{margin:0 0 7px;font-family:"IBM Plex Mono",monospace;font-size:12px}.plu-detail .photos{margin-top:7px}</style>');

function ensurePlusPhotoInputs(){
  document.querySelectorAll('.plus-row').forEach(row=>{
    if(row.querySelector('.p-photos'))return;
    const wrap=document.createElement('div');
    wrap.className='plus-photo-wrap';
    wrap.innerHTML='<label>Fotos de este PLU</label><input class="p-photos" type="file" accept="image/*" multiple>';
    row.appendChild(wrap);
  });
}
const addPlusWithoutPhotos=window.addPlus;
window.addPlus=function(){addPlusWithoutPhotos();ensurePlusPhotoInputs()};
ensurePlusPhotoInputs();

const receptionForm=document.getElementById('form');
receptionForm?.addEventListener('submit',async event=>{
  event.preventDefault();
  event.stopImmediatePropagation();
  const status=$('status'); status.className='status'; status.textContent='Guardando...';
  const form=event.currentTarget;
  const rows=[...document.querySelectorAll('.plus-row')];
  const plus=rows.map(row=>({
    plu_codigo:row.querySelector('.p-code').value.split(' · ')[0].trim(),
    plu_articulo:row.querySelector('.p-name').value,
    afectacion:row.querySelector('.p-aff').value||null,
    observacion:row.querySelector('.p-obs').value
  }));
  const formData=new FormData(form);
  formData.set('plus_json',JSON.stringify(plus));
  const fotoIndices=[];
  [...$('fotos').files].forEach(file=>{formData.append('fotos',file);fotoIndices.push(null)});
  rows.forEach((row,index)=>[...(row.querySelector('.p-photos')?.files||[])].forEach(file=>{formData.append('fotos',file);fotoIndices.push(index)}));
  formData.set('foto_plu_indices',JSON.stringify(fotoIndices));
  try{
    const data=await api('/api/recepcion',{method:'POST',body:formData});
    status.textContent='Guardado correctamente. ID '+data.id;
    form.reset();$('plus-list').innerHTML='';addPlus();$('preview').innerHTML='';
    $('fecha').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
  }catch(error){status.className='status error';status.textContent=error.message}
},true);

window.openDetail=async function(id){
  try{
    const data=await api('/api/recepcion/'+id);
    const plusById=new Map((data.plus||[]).map(item=>[item.id,item]));
    const photoHtml=photos=>(photos||[]).map(photo=>`<a href="/api/recepcion/fotos/${photo.id}" target="_blank"><img class="thumb" src="/api/recepcion/fotos/${photo.id}" alt="${esc(photo.nombre_original)}"></a>`).join('')||'Sin fotos';
    const general=(data.fotos||[]).filter(photo=>!photo.recepcion_plus_id);
    const pluSections=(data.plus||[]).map(item=>{
      const photos=(data.fotos||[]).filter(photo=>photo.recepcion_plus_id===item.id);
      const afectacion=item.afectacion===null||item.afectacion===undefined||item.afectacion===''?'Sin porcentaje':`${esc(item.afectacion)}%`;
      return `<section class="plu-detail"><h4>${esc(item.plu_codigo)} · ${esc(item.plu_articulo)}</h4><div class="plu-affectation">Afectación: <strong>${afectacion}</strong></div><div class="photos">${photoHtml(photos)}</div></section>`;
    }).join('');
    $('detail').innerHTML=`<div class="cards">${[['Fecha',data.recepcion.fecha_descarga],['Proveedor',data.recepcion.proveedor_nombre],['Recepcionista',data.recepcion.recepcionista_nombre],['Pallets',data.recepcion.pallets_recibidos+' / '+data.recepcion.pallets_auditados]].map(x=>`<div class="card"><small>${esc(x[0])}</small><strong>${esc(x[1])}</strong></div>`).join('')}</div><h3>Fotos generales</h3><div class="photos">${photoHtml(general)}</div><h3>Fotos por PLU</h3>${pluSections||'Sin PLU asociados.'}`;
    $('modal').classList.remove('hidden');
  }catch(error){alert(error.message)}
};
</script>
