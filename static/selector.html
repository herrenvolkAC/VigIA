<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/resources/APPLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <title>VigIA - Selector</title>
  <style>
    :root{
      --bg:#F2F4F1;--panel:#FFFFFF;--ink:#0E1620;--ink-soft:#5C6773;
      --rule:#D4DBD8;--rule-strong:#A9B4AC;--green:#1F7A4D;--green-soft:#E5F3E9;
      --amber:#B25F00;--amber-soft:#FBE7C8;--red:#C8102E;--blue:#0B5FAE;
      --module-color:#1F7A4D;--module-soft:#E5F3E9;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;min-height:100vh;color:var(--ink);
      font-family:'IBM Plex Sans',system-ui,sans-serif;background-color:var(--bg);
      background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
      background-size:24px 24px;
    }
    button{font:inherit;color:inherit;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
    .paper-app{width:100%;min-height:100vh;padding:0 16px 16px}
    .paper-header{
      display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;
      padding:12px 16px;background:var(--panel);border:1px solid var(--rule);border-bottom-color:var(--rule-strong);
    }
    .brand-block{display:flex;align-items:center;gap:14px;min-width:0}
    .brand-logo{width:86px;height:42px;object-fit:contain}
    .brand-rule{width:1px;height:28px;background:var(--rule)}
    .kicker,.label{
      font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.17em;
      text-transform:uppercase;color:var(--ink-soft);
    }
    .kicker{margin-bottom:3px}
    h1{font-size:20px;line-height:1.05;font-weight:600;margin:0}
    .amp{color:var(--red)}
    .header-status{
      justify-self:center;display:flex;align-items:center;gap:9px;
      font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
    }
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
    .header-right{display:flex;align-items:center;gap:10px}
    .user-chip{display:flex;align-items:center;border:1px solid var(--rule);border-radius:2px;background:var(--panel);padding:5px 10px}
    .user-value{
      font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--green);
      max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .logout-btn{
      min-height:28px;border:1px solid var(--rule);border-radius:2px;background:var(--panel);color:var(--ink-soft);
      padding:6px 10px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    }
    .logout-btn:hover{color:var(--red);border-color:var(--red)}
    .env-banner{
      display:none;margin:8px 0 0;border:1px solid var(--amber);background:var(--amber-soft);color:#6F4300;
      padding:7px 11px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    }
    .env-banner.visible{display:block}
    .selector-heading{
      display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px;
      margin-top:10px;padding:11px 12px;background:var(--panel);border:1px solid var(--rule);
    }
    .selector-heading h2{font-size:16px;font-weight:600;margin:2px 0 0}
    .selector-note{font-size:11px;color:var(--ink-soft);margin-top:3px}
    .module-count{
      font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
      color:var(--green);border:1px solid #C8E2D0;background:var(--green-soft);padding:5px 8px;
    }
    .module-grid{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px;
    }
    .module-card{
      position:relative;overflow:hidden;display:grid;grid-template-columns:58px 1fr;grid-template-rows:auto 1fr auto;
      column-gap:12px;min-width:0;min-height:140px;padding:12px 13px;background:var(--panel);
      border:1px solid var(--rule);border-top:4px solid var(--module-color);color:var(--ink);text-decoration:none;
      transition:border-color .15s ease,background-color .15s ease,transform .15s ease;
    }
    .module-card::after{
      content:"";position:absolute;right:-22px;top:-28px;width:76px;height:76px;border-radius:50%;
      background:var(--module-soft);opacity:.65;pointer-events:none;
    }
    .module-card.active:hover{border-color:var(--module-color);background:#F8FAF7;transform:translateY(-2px)}
    .module-card.inactive{filter:saturate(.45);opacity:.72;color:var(--ink-soft);background:#F8FAF7}
    .module-card.denied{filter:grayscale(1);opacity:.48;cursor:not-allowed;border-top-color:var(--rule-strong)}
    .module-icon{
      position:relative;z-index:1;grid-row:1 / span 2;width:56px;height:56px;display:grid;place-items:center;
      border:1px solid color-mix(in srgb,var(--module-color) 45%,var(--rule));background:var(--module-soft);color:var(--module-color);
    }
    .module-icon svg{width:30px;height:30px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .module-title{position:relative;z-index:1;font-size:14px;font-weight:600;line-height:1.15;min-width:0}
    .module-description{
      position:relative;z-index:1;grid-column:2;font-size:11px;line-height:1.35;color:var(--ink-soft);margin-top:5px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .module-footer{
      grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding-top:8px;margin-top:8px;border-top:1px solid var(--rule);
      font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
    }
    .module-state{display:flex;align-items:center;gap:6px}
    .module-state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rule-strong)}
    .active .module-state{color:var(--module-color)}
    .active .module-state::before{background:var(--module-color)}
    .module-arrow{font-size:13px;color:var(--module-color);letter-spacing:0}
    .inactive .module-arrow,.denied .module-arrow{display:none}
    .productividad{--module-color:#0B5FAE;--module-soft:#E4F0FB}
    .rrhh{--module-color:#1F7A4D;--module-soft:#E5F3E9}
    .gestion{--module-color:#6D4AA2;--module-soft:#EEE8F7}
    .casos{--module-color:#C8102E;--module-soft:#F7D7DA}
    .panol{--module-color:#B25F00;--module-soft:#FBE7C8}
    .historia{--module-color:#007C91;--module-soft:#DFF2F4}
    .opex{--module-color:#2E8B57;--module-soft:#E1F2E8}
    .simulador_operativo{--module-color:#007C91;--module-soft:#DFF2F4}
    .premio{--module-color:#A83B7A;--module-soft:#F4E2ED}
    .plantel_optimo{--module-color:#3765A3;--module-soft:#E4ECF7}
    .recepcion{--module-color:#D07800;--module-soft:#FCEACD}
    .rendimiento{--module-color:#0B5FAE;--module-soft:#E4F0FB}
    .checklist{--module-color:#1F7A4D;--module-soft:#E5F3E9}
    .mapa{--module-color:#3765A3;--module-soft:#E4ECF7}
    .monitor{--module-color:#007C91;--module-soft:#DFF2F4}
    .trafico{--module-color:#8B5E34;--module-soft:#EFE6DC}
    .generales{--module-color:#58636E;--module-soft:#E8EBED}
    @media(max-width:1100px){
      .module-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .paper-header{grid-template-columns:auto 1fr}.header-status{display:none}.header-right{justify-self:end}
    }
    @media(max-width:780px){
      .paper-app{padding:0 10px 12px}.paper-header{grid-template-columns:1fr;padding:10px}
      .header-right{justify-self:start}.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .selector-heading{grid-template-columns:1fr}.module-count{justify-self:start}
    }
    @media(max-width:520px){.module-grid{grid-template-columns:1fr}.module-card{min-height:118px}}
  </style>
</head>
<body>
<div class="paper-app">
  <header class="paper-header">
    <div class="brand-block">
      <img class="brand-logo" src="/resources/CotoLogo.svg" alt="Coto">
      <div class="brand-rule"></div>
      <div>
        <div class="kicker">Modulo operativo</div>
        <h1>Selector <span class="amp">VigIA</span></h1>
      </div>
    </div>
    <div class="header-status"><span class="status-dot"></span><span>Acceso centralizado</span></div>
    <div class="header-right">
      <div class="user-chip">
        <div><div class="label">Usuario</div><div class="user-value" id="user-label">Validando...</div></div>
      </div>
      <button class="logout-btn" id="logout-btn">Salir</button>
    </div>
  </header>
  <div class="env-banner" id="env-banner"></div>

  <section class="selector-heading">
    <div>
      <div class="label">Centro de distribucion</div>
      <h2>Aplicaciones operativas</h2>
      <div class="selector-note">Selecciona el modulo de trabajo para continuar.</div>
    </div>
    <div class="module-count" id="module-count">Cargando modulos...</div>
  </section>

  <main class="module-grid" id="module-grid"></main>
</div>

<script>
  const MODULES = [
    {id:'productividad',icon:'bar-chart',label:'Productividad',url:'/productividad.html',active:true,description:'Productividad online, ranking por operario y lectura del turno.'},
    {id:'novedades_cd',style:'rrhh',icon:'calendar-alert',label:'Tablero RRHH',url:'/novedades-cd',active:true,description:'Novedades CD, ausentismo, horas extra, francos e indicadores.'},
    {id:'gestion_operativa',style:'gestion',icon:'clipboard-list',label:'Gestion Operativa',url:'/gestion-operativa.html',active:true,description:'Herramientas de coordinacion y seguimiento operativo de piso.'},
    {id:'casos',icon:'ticket',label:'Gestion de Casos',url:'/casos.html',active:true,description:'Tickets operativos, SLA, adjuntos, comentarios e historial.'},
    {id:'panol',icon:'package',label:'Panol Insumos',url:'/panol-insumos.html',active:true,description:'Stock, inventarios, movimientos e importacion de stock CD.'},
    {id:'historia_legajo',style:'historia',icon:'id-card',label:'Historia de Legajo',url:'/historia-legajo.html',active:true,description:'Ficha operativa integral por legajo y actividad historica.'},
    {id:'opex',icon:'target',label:'OpEX',url:'/opex.html',active:true,description:'Seguimiento diario de metas, desvios y acciones operativas para alinear los equipos.'},
    {id:'simulador_operativo',icon:'sliders',label:'Simulador Operativo',url:'/simulador-operativo.html',active:true,description:'Importacion CSV, indicadores, articulos criticos y escenarios de mejora.'},
    {id:'analisis_premio_productividad',style:'premio',icon:'award',label:'Analisis Premio Productividad',url:'/analisis-premio-productividad.html',active:true,hideWhenDenied:true,description:'Auditoria y simulacion de modelos de pago.'},
    {id:'plantel_optimo',icon:'users',label:'Actividad semanal por legajo',url:'/plantel-optimo.html',active:true,description:'Funciones del legajero y actividades realizadas por día desde Productividad.'},
    {id:'rendimiento_online',style:'rendimiento',icon:'gauge',label:'Analisis Rendimiento',url:'/rendimiento-online.html',active:true,description:'Productividad online por almacen, sector y legajo contra estandar.'},
    {id:'checklist_tareas',style:'checklist',icon:'check-square',label:'CheckList Tareas',url:'/checklist-tareas',active:true,description:'Tareas operativas recurrentes, responsables, pendientes y trazabilidad por sector.'},
    {id:'recepcion',style:'recepcion',icon:'package',label:'Recepción Refrigerados',url:'/recepcion.html',active:true,description:'Alta de descargas, múltiples PLU, fotos de inspección y consulta de registros.'},
    {id:'control_procesos',style:'monitor',icon:'truck',label:'Monitor Cargas',url:'/monitor-cargas',active:true,description:'Carga y ocupacion por anden: matricula, bultos y volumen de viajes abiertos.'},
    {id:'trafico',icon:'truck',label:'Trafico',active:false,state:'En desarrollo',description:'Programacion de muelles, flota, entradas y salidas.'},
    {id:'generales',icon:'calculator',label:'Herramientas Operativas',url:'/herramientas.html',active:true,description:'Calculadoras simples para prorrateos, calendarios y controles operativos.'},
  ];

  const ICONS = {
    'activity':'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>',
    'award':'<circle cx="12" cy="8" r="5"></circle><path d="M8.5 12.5 7 22l5-3 5 3-1.5-9.5"></path>',
    'bar-chart':'<path d="M4 20V10"></path><path d="M12 20V4"></path><path d="M20 20v-7"></path><path d="M3 20h18"></path>',
    'calendar-alert':'<rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M12 14v3"></path><path d="M12 19h.01"></path>',
    'calculator':'<rect x="5" y="2" width="14" height="20" rx="2"></rect><path d="M8 6h8"></path><path d="M8 10h.01"></path><path d="M12 10h.01"></path><path d="M16 10h.01"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path>',
    'check-square':'<rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="m7 12 3 3 7-7"></path>',
    'clipboard-list':'<rect x="8" y="3" width="8" height="4" rx="1"></rect><path d="M9 5H6a2 2 0 0 0-2 2v13h16V7a2 2 0 0 0-2-2h-3"></path><path d="M8 12h8"></path><path d="M8 16h6"></path>',
    'gauge':'<path d="M4 16a8 8 0 1 1 16 0"></path><path d="M12 16l4-5"></path><path d="M6 20h12"></path>',
    'id-card':'<rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16c.7-1.3 1.7-2 3-2s2.3.7 3 2"></path><path d="M14 10h4"></path><path d="M14 14h3"></path>',
    'package':'<path d="M21 8.5 12 3 3 8.5 12 14l9-5.5Z"></path><path d="M3 8.5V16l9 5 9-5V8.5"></path><path d="M12 14v7"></path>',
    'settings':'<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a8 8 0 0 0 .1-2l2-1.2-2-3.4-2.3 1a7 7 0 0 0-1.7-1L15.2 6h-4l-.3 2.4a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.2a8 8 0 0 0 .1 2l-2.1 1.2 2 3.4 2.4-1a7 7 0 0 0 1.6.9l.3 2.5h4l.3-2.5a7 7 0 0 0 1.6-.9l2.4 1 2-3.4-2.1-1.2Z"></path>',
    'sliders':'<path d="M4 6h8"></path><path d="M16 6h4"></path><circle cx="14" cy="6" r="2"></circle><path d="M4 18h4"></path><path d="M12 18h8"></path><circle cx="10" cy="18" r="2"></circle><path d="M4 12h2"></path><path d="M10 12h10"></path><circle cx="8" cy="12" r="2"></circle>',
    'target':'<circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle>',
    'ticket':'<path d="M4 7h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4V7Z"></path><path d="M9 9v6"></path><path d="M15 9v6"></path>',
    'truck':'<path d="M3 7h11v9H3z"></path><path d="M14 10h4l3 3v3h-7"></path><circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle>',
    'users':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>',
  };

  function moduleIcon(name) {
    const body = ICONS[name] || ICONS.settings;
    return `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${body}</svg>`;
  }

  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

  function renderModules(access) {
    const visibleModules = MODULES.filter(module => !(module.hideWhenDenied && module.active && !access[module.id]));
    $('module-grid').innerHTML = visibleModules.map(module => {
      const allowed = Boolean(access[module.id]);
      const available = module.active && allowed;
      const state = !module.active ? module.state : allowed ? 'Disponible' : 'Sin acceso';
      const content = `
        <div class="module-icon" aria-hidden="true">${moduleIcon(module.icon)}</div>
        <div class="module-title">${esc(module.label)}</div>
        <div class="module-description">${esc(module.description)}</div>
        <div class="module-footer">
          <span class="module-state">${esc(state)}</span>
          <span class="module-arrow">></span>
        </div>`;
      const style = esc(module.style || module.id);
      return available
        ? `<a class="module-card active ${style}" href="${esc(module.url)}">${content}</a>`
        : `<article class="module-card ${module.active ? 'denied' : 'inactive'} ${style}" title="${module.active ? 'Tu usuario no tiene acceso habilitado.' : esc(module.state)}">${content}</article>`;
    }).join('');
    $('module-count').textContent = `${MODULES.filter(module => module.active && access[module.id]).length} modulos habilitados`;
  }

  async function loadAppInfo() {
    try {
      const res = await fetch('/api/app-info', {credentials:'same-origin'});
      if (!res.ok) return;
      const info = await res.json();
      if (info.show_banner && info.banner) {
        $('env-banner').textContent = info.banner;
        $('env-banner').classList.add('visible');
      }
    } catch (_) {}
  }

  async function initSelector() {
    const res = await fetch('/api/auth/me', {credentials:'same-origin'}).catch(() => null);
    if (!res || !res.ok) {
      window.location.replace('/login?next=/selector.html');
      return;
    }
    const user = await res.json();
    const appsRes = await fetch('/api/auth/apps', {credentials:'same-origin'});
    if (!appsRes.ok) {
      window.location.replace('/login?next=/selector.html');
      return;
    }
    const apps = await appsRes.json();
    sessionStorage.setItem('vigia_session', JSON.stringify({
      user:user.username,name:user.display_name || user.username,role:user.role,
    }));
    $('user-label').textContent = user.display_name || user.username;
    renderModules(apps.access || {});
    await loadAppInfo();
  }

  $('logout-btn').onclick = async () => {
    sessionStorage.removeItem('vigia_session');
    await fetch('/api/auth/logout', {method:'POST',credentials:'same-origin'}).catch(() => {});
    window.location.replace('/login');
  };

  initSelector();
</script>
</body>
</html>
